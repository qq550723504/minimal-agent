services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_DEPLOYMENT_MODE: ${AGENT_DEPLOYMENT_MODE:-development}
      AGENT_LLM_BACKEND: ${AGENT_LLM_BACKEND:-mock}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      AGENT_EMBEDDING_BACKEND: ${AGENT_EMBEDDING_BACKEND:-mock}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      AGENT_ENABLE_MEMORY: "true"
      VECTOR_MEMORY_PATH: /app/data/vector_memory.json
      AGENT_AUDIT_LOG: /app/data/audit.log
      WORKFLOW_STORE_PATH: ${WORKFLOW_STORE_PATH:-/app/data/workflows.sqlite3}
      AGENT_AUTH_REQUIRED: ${AGENT_AUTH_REQUIRED:-false}
      AGENT_API_KEYS: ${AGENT_API_KEYS:-}
      AGENT_METRICS_API_KEY: ${AGENT_METRICS_API_KEY:-local-dev-metrics}
      AGENT_HTTP_ALLOWED_HOSTS: ${AGENT_HTTP_ALLOWED_HOSTS:-}
      AGENT_MAX_TOOL_RESULT_BYTES: ${AGENT_MAX_TOOL_RESULT_BYTES:-1048576}
      AGENT_CAPABILITY_RUNTIME_ENABLED: ${AGENT_CAPABILITY_RUNTIME_ENABLED:-false}
      AGENT_STRUCTURED_TOOL_CALLING_ENABLED: ${AGENT_STRUCTURED_TOOL_CALLING_ENABLED:-false}
      AGENT_PLUGIN_DIR: /app/plugins
      AGENT_MCP_ALLOWED_HOSTS: ${AGENT_MCP_ALLOWED_HOSTS:-}
      AGENT_MCP_STDIO_ALLOWED_COMMANDS: ${AGENT_MCP_STDIO_ALLOWED_COMMANDS:-}
      AGENT_MCP_STARTUP_TIMEOUT_SECONDS: ${AGENT_MCP_STARTUP_TIMEOUT_SECONDS:-30}
      AGENT_MCP_DISCOVERY_TIMEOUT_SECONDS: ${AGENT_MCP_DISCOVERY_TIMEOUT_SECONDS:-30}
      AGENT_MCP_SHUTDOWN_TIMEOUT_SECONDS: ${AGENT_MCP_SHUTDOWN_TIMEOUT_SECONDS:-10}
      AGENT_MAX_ACTIVE_SKILLS: ${AGENT_MAX_ACTIVE_SKILLS:-3}
      AGENT_MAX_SKILL_REFERENCE_BYTES: ${AGENT_MAX_SKILL_REFERENCE_BYTES:-262144}
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data:/etc/prometheus/data:ro
