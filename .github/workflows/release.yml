name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Run service self-check
        run: |
          python -m uvicorn src.agent.api.app:app --host 127.0.0.1 --port 8001 --lifespan off &
          sleep 3
          curl -f http://127.0.0.1:8001/
          pkill -f "uvicorn src.agent.api.app:app"
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }} for minimal-agent.
            See CHANGELOG.md for details.
